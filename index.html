<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حاسبة المصاريف</title>
<meta name="description" content="حاسبة مصاريف سهلة وسريعة لتنظيم الفواتير وحساب إجمالي المصروفات.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_AR">
<meta property="og:title" content="حاسبة المصاريف">
<meta property="og:description" content="حاسبة مصاريف سهلة وسريعة لتنظيم الفواتير وحساب إجمالي المصروفات.">
<meta property="og:image" content="https://p6b9h8w25k-oss.github.io/masareef/share-image.png">
<meta property="og:image:alt" content="حاسبة المصاريف">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="حاسبة المصاريف">
<meta name="twitter:description" content="حاسبة مصاريف سهلة وسريعة لتنظيم الفواتير وحساب إجمالي المصروفات.">
<meta name="twitter:image" content="https://p6b9h8w25k-oss.github.io/masareef/share-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --font-display:'Lalezar','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --bg:#F3F6E6; --surface:#FFFFFF; --surface-2:#E4ECCB; --ink:#3B4520; --ink-soft:#6C7854; --line:#C5D2A0;
  --blue:#D8A854; --on-blue:#2E3819; --blue-deep:#6E8A3E; --rose:#F5DDB5; --rose-deep:#7A4A1E; --danger:#8A3A2A;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#242C17; --surface:#303A20; --surface-2:#3A4628; --ink:#F0EAD0; --ink-soft:#B9C29A; --line:#4A5632;
  --blue:#D8A854; --on-blue:#1F2713; --blue-deep:#B5CC84; --rose:#4A3A22; --rose-deep:#F0CF9A; --danger:#F0A090; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#242C17; --surface:#303A20; --surface-2:#3A4628; --ink:#F0EAD0; --ink-soft:#B9C29A; --line:#4A5632;
  --blue:#D8A854; --on-blue:#1F2713; --blue-deep:#B5CC84; --rose:#4A3A22; --rose-deep:#F0CF9A; --danger:#F0A090; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.6; direction:rtl;
  padding-block:20px 40px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--blue-deep); outline-offset:2px}
.brand-big{display:block;margin:4px auto 0;height:170px;width:170px;max-width:80%;object-fit:contain}
.brand-mini{display:block;margin:0 auto;height:72px;width:72px;object-fit:contain}
.wrap{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:16px; min-width:0}
.card{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:22px 20px; display:flex; flex-direction:column; gap:14px; min-width:0}
h1,h2{font-family:var(--font-display); font-weight:400; margin:0; line-height:1.3; text-wrap:balance}
h1{font-size:clamp(28px,7vw,36px)} h2{font-size:clamp(22px,5.5vw,28px)}
.lead{color:var(--ink-soft); margin:0; font-size:15px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.grow{flex:1 1 140px; min-width:0}
.field{width:100%; border:2px solid var(--line); background:var(--bg); border-radius:12px; padding:10px 12px; font-size:16px; min-width:0}
.field:focus{border-color:var(--blue-deep); outline:none}
.field.ltr{direction:ltr; text-align:left}
.label{font-size:13px; color:var(--ink-soft); margin-bottom:-6px}
.btn{border:0; border-radius:12px; padding:11px 18px; font-weight:700; font-size:16px; cursor:pointer; background:var(--blue); color:var(--on-blue)}
.btn:hover{filter:brightness(.96)}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink); font-weight:500}
.btn.danger{background:transparent; border:1px solid var(--danger); color:var(--danger); font-weight:600}
.btn.small{padding:6px 12px; font-size:14px; border-radius:10px}
.note{font-size:14px; padding:10px 14px; border-radius:12px; background:var(--surface-2)}
.note.warn{background:var(--rose); color:var(--rose-deep)}
.inv{display:flex; flex-direction:column; gap:4px; text-align:right; border:1px solid var(--line); border-radius:16px; padding:14px; background:var(--surface); cursor:pointer; width:100%}
.inv:hover{border-color:var(--blue-deep)}
.inv b{font-size:18px}
.inv span{font-size:14px; color:var(--ink-soft)}
.list{display:flex; flex-direction:column; gap:10px}
.item{display:grid; grid-template-columns:1fr auto; gap:4px 10px; padding:12px 0; border-bottom:1px solid var(--line); min-width:0}
.item:last-child{border-bottom:0}
.item .nm{font-weight:600; overflow-wrap:anywhere}
.item .meta{font-size:13px; color:var(--ink-soft); grid-column:1}
.item .amt{font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap; text-align:left; direction:ltr}
.item .del{grid-column:2; justify-self:start; align-self:start}
.item .amt-wrap{grid-column:2; display:flex; flex-direction:column; align-items:flex-end; gap:6px}
.total{display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:18px; font-weight:700; padding-top:10px; border-top:2px solid var(--line)}
.total .v{font-family:var(--font-display); font-weight:400; font-size:26px; direction:ltr; font-variant-numeric:tabular-nums; color:var(--blue-deep)}
.time-row{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.time-row select,.time-row input{border:2px solid var(--line); background:var(--bg); border-radius:12px; padding:9px 10px; min-width:0}
.time-row input{width:72px; direction:ltr; text-align:center}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
table{width:100%; border-collapse:collapse; font-size:14px}
th,td{padding:8px 6px; border-bottom:1px solid var(--line); text-align:right; vertical-align:top}
th{color:var(--ink-soft); font-weight:600}
td.n{font-variant-numeric:tabular-nums; direction:ltr; text-align:left; white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.sum-head{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:baseline}
.sum-head span{color:var(--ink-soft); font-size:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@page{size:A4 portrait;margin:12mm}
@media print{
  :root{color-scheme:light}
  body{background:#fff!important;padding:0!important;font-size:10px}
  .wrap{max-width:none!important;gap:8px}
  .brand-mini,.brand-big{height:42px;width:42px;margin:0 auto 4px}
  .card{border:1px solid #bbb!important;border-radius:0!important;padding:10px!important;gap:7px;break-inside:avoid}
  h1{font-size:20px!important}
  table{font-size:9px!important}
  th,td{padding:4px!important}
  .total{font-size:13px!important;padding-top:5px}
  .total .v{font-size:18px!important}
  .print-hide{display:none!important}
}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SAFRA={url:'https://cfbssrckccuiggzrtsqb.supabase.co',anonKey:'sb_publishable_VNURoHDD3SObD-VPEBBbJA_PzdmbiNC'};
(function(){
'use strict';
var sb=null;
try{if(window.supabase)sb=window.supabase.createClient(SAFRA.url,SAFRA.anonKey);}catch(e){sb=null;}

var root=document.getElementById('root');
var code='',invoices=[],view='gate',openId=null,notice='',noticeWarn=false,busy=false;
try{code=sessionStorage.getItem('exp-code')||'';}catch(e){}

function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}
function btn(text,cls,fn){var b=el('button',cls||'btn',text);b.type='button';b.addEventListener('click',fn);return b;}
function fmt(n){return (Math.round(n*100)/100).toFixed(2)+' ريال';}
function dateAr(s){if(!s)return '';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function timeAr(t){if(!t)return '';return t.h+':'+(t.m<10?'0':'')+t.m+' '+t.p;}
function lineTotal(it){return (Number(it.price)||0)*(Number(it.qty)||1);}
function grand(items){var s=0;items.forEach(function(it){s+=lineTotal(it);});return s;}
function findInv(id){for(var i=0;i<invoices.length;i++)if(invoices[i].id===id)return invoices[i];return null;}
function newId(){return 'inv-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);}
function setNotice(t,warn){notice=t;noticeWarn=!!warn;}
function note(){if(!notice)return null;var n=el('div','note'+(noticeWarn?' warn':''),notice);return n;}

var LOGO='logo.webp';
function render(){
  clear(root);
  var lg=document.createElement('img');lg.className=view==='gate'?'brand-big':'brand-mini';lg.src=LOGO;lg.alt='حاسبة المصاريف';root.appendChild(lg);
  if(view==='gate')return scrGate();
  if(view==='list')return scrList();
  if(view==='invoice')return scrInvoice();
  if(view==='total')return scrTotal();
}

/* ---- remote ---- */
function rpc(name,args){
  if(!sb)return Promise.reject({message:'nosb'});
  return sb.rpc(name,args).then(function(res){if(res.error)throw res.error;return res.data;});
}
function loadInvoices(){
  busy=true;
  return rpc('exp_list',{p_code:code}).then(function(data){
    busy=false;
    invoices=(data||[]).map(function(r){return {id:r.id,title:r.title,items:Array.isArray(r.items)?r.items:[],updated_at:r.updated_at};});
    return true;
  },function(e){
    busy=false;
    if(/bad_code/.test((e&&e.message)||'')){code='';try{sessionStorage.removeItem('exp-code');}catch(x){}setNotice('الرمز غلط أو انتهت الجلسة.',true);view='gate';return false;}
    setNotice('ما قدرنا نحمّل الفواتير. تأكد من الإنترنت.',true);return false;
  });
}
function saveInvoice(inv){
  return rpc('exp_save',{p_code:code,p_id:inv.id,p_title:inv.title,p_items:inv.items}).then(function(){
    setNotice('تم الحفظ.',false);render();
  },function(){setNotice('ما انحفظت. تأكد من الإنترنت وحاول مرة ثانية.',true);render();});
}

/* ---- gate ---- */
function scrGate(){
  var c=el('div','card');
  c.appendChild(el('h1','','حاسبة المصاريف'));
  c.appendChild(el('p','lead','أدخل الرمز للدخول.'));
  var inp=document.createElement('input');inp.className='field ltr';inp.type='password';inp.inputMode='numeric';inp.maxLength=4;inp.placeholder='••••';
  c.appendChild(inp);
  var n=note();if(n)c.appendChild(n);
  function go(){
    var v=inp.value.trim();if(!/^\d{4}$/.test(v)){setNotice('الرمز أربعة أرقام.',true);render();return;}
    code=v;
    loadInvoices().then(function(ok){
      if(ok){try{sessionStorage.setItem('exp-code',v);}catch(e){}view='list';setNotice('',false);}
      render();
    });
  }
  c.appendChild(btn('دخول','btn',go));
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')go();});
  root.appendChild(c);
  if(!sb){setNotice('الاتصال غير متاح. تأكد من إعداد Supabase.',true);render();}
}

/* ---- list ---- */
function scrList(){
  var h=el('div','row');
  h.appendChild(el('h1','grow','فواتيري'));
  h.appendChild(btn('تحديث','btn ghost small',function(){loadInvoices().then(function(){render();});}));
  root.appendChild(h);
  var n=note();if(n)root.appendChild(n);
  var c=el('div','card');
  c.appendChild(el('p','lead','كل فاتورة مثل سفرة أو مصاريف شهر. اختر فاتورة أو أنشئ واحدة جديدة.'));
  var nf=el('div','row');
  var title=document.createElement('input');title.className='field grow';title.placeholder='اسم الفاتورة، مثل: سفرة مكة';title.maxLength=60;
  nf.appendChild(title);
  nf.appendChild(btn('فاتورة جديدة','btn',function(){
    var t=title.value.trim();if(!t){title.focus();return;}
    var inv={id:newId(),title:t,items:[],updated_at:new Date().toISOString()};
    invoices.unshift(inv);openId=inv.id;view='invoice';
    saveInvoice(inv);
  }));
  c.appendChild(nf);
  root.appendChild(c);
  if(!invoices.length){root.appendChild(el('div','note','ما عندك فواتير بعد. اكتب اسم فاتورة فوق وابدأ.'));return;}
  var list=el('div','list');
  invoices.forEach(function(inv){
    var b=el('button','inv');b.type='button';
    b.appendChild(el('b','',inv.title));
    b.appendChild(el('span','',inv.items.length+' بنود · '+fmt(grand(inv.items))));
    b.addEventListener('click',function(){openId=inv.id;view='invoice';setNotice('',false);render();});
    list.appendChild(b);
  });
  root.appendChild(list);
}

/* ---- invoice ---- */
function scrInvoice(){
  var inv=findInv(openId);
  if(!inv){view='list';return render();}
  var top=el('div','row');
  top.appendChild(btn('رجوع','btn ghost small',function(){view='list';setNotice('',false);render();}));
  top.appendChild(el('h1','grow',inv.title));
  root.appendChild(top);
  var n=note();if(n)root.appendChild(n);

  var c=el('div','card');
  if(!inv.items.length){c.appendChild(el('p','lead','ما فيه بنود بعد. أضف أول بند تحت.'));}
  else{
    var list=el('div','');
    inv.items.forEach(function(it,idx){
      var row=el('div','item');
      row.appendChild(el('div','nm',it.name));
      var meta=[];
      if(it.qty&&it.qty!==1)meta.push(it.qty+' × '+(Number(it.price)||0).toFixed(2));
      if(it.date)meta.push(dateAr(it.date));
      if(it.time)meta.push(timeAr(it.time));
      if(meta.length)row.appendChild(el('div','meta',meta.join(' · ')));
      var aw=el('div','amt-wrap');
      aw.appendChild(el('div','amt',fmt(lineTotal(it))));
      aw.appendChild(btn('حذف','btn danger small',function(){
        inv.items.splice(idx,1);inv.updated_at=new Date().toISOString();setNotice('',false);saveInvoice(inv);
      }));
      row.appendChild(aw);
      list.appendChild(row);
    });
    c.appendChild(list);
  }
  c.appendChild(el('div','total',''));
  c.lastChild.appendChild(el('span','','الإجمالي'));
  c.lastChild.appendChild(el('span','v',fmt(grand(inv.items))));
  root.appendChild(c);

  /* add item */
  var a=el('div','card');
  a.appendChild(el('h2','','بند جديد'));
  var name=document.createElement('input');name.className='field';name.placeholder='الاسم، مثل: شاورما';name.maxLength=80;
  var g=el('div','grid2');
  var price=document.createElement('input');price.className='field ltr';price.placeholder='السعر';price.inputMode='decimal';
  var qty=document.createElement('input');qty.className='field ltr';qty.placeholder='الكمية (اختياري، الافتراضي 1)';qty.inputMode='numeric';
  g.appendChild(price);g.appendChild(qty);
  var date=document.createElement('input');date.className='field ltr';date.type='date';
  var tr=el('div','time-row');
  var hh=document.createElement('select');hh.appendChild(new Option('الساعة','' ));
  for(var i=1;i<=12;i++)hh.appendChild(new Option(String(i),String(i)));
  var mm=document.createElement('input');mm.type='text';mm.inputMode='numeric';mm.maxLength=2;mm.placeholder='00';
  var pp=document.createElement('select');pp.appendChild(new Option('ص','ص'));pp.appendChild(new Option('م','م'));
  tr.appendChild(hh);tr.appendChild(mm);tr.appendChild(pp);
  var lab1=el('div','label','التاريخ (اختياري، ميلادي)');
  var lab2=el('div','label','الوقت (اختياري، نظام 12 ساعة)');
  a.appendChild(name);a.appendChild(g);a.appendChild(lab1);a.appendChild(date);a.appendChild(lab2);a.appendChild(tr);
  a.appendChild(btn('أضف البند','btn',function(){
    var nm=name.value.trim();var pr=parseFloat(String(price.value).replace(',','.'));
    var q=qty.value.trim()===''?1:parseInt(qty.value,10);
    if(!nm){name.focus();setNotice('اكتب اسم البند.',true);render();return;}
    if(isNaN(pr)||pr<0){price.focus();setNotice('اكتب سعر صحيح.',true);render();return;}
    if(isNaN(q)||q<1){qty.focus();setNotice('الكمية لازم تكون رقم أكبر من صفر.',true);render();return;}
    var t=null;
    if(hh.value){var m=parseInt(mm.value===''?'0':mm.value,10);if(isNaN(m)||m<0||m>59){mm.focus();setNotice('الدقائق بين 0 و 59.',true);render();return;}t={h:parseInt(hh.value,10),m:m,p:pp.value};}
    inv.items.push({name:nm,price:Math.round(pr*100)/100,qty:q,date:date.value||'',time:t});
    inv.updated_at=new Date().toISOString();
    setNotice('',false);
    saveInvoice(inv);
  }));
  root.appendChild(a);

  root.appendChild(btn('احسب الفاتورة','btn',function(){view='total';render();}));
  var dz=el('div','row');
  var del=btn('حذف الفاتورة','btn danger',function(){
    if(!del.dataset.arm){del.dataset.arm='1';del.textContent='اضغط مرة ثانية للتأكيد';return;}
    rpc('exp_delete',{p_code:code,p_id:inv.id}).then(function(){
      invoices=invoices.filter(function(x){return x.id!==inv.id;});view='list';setNotice('تم حذف الفاتورة.',false);render();
    },function(){setNotice('ما قدرنا نحذفها. حاول مرة ثانية.',true);render();});
  });
  dz.appendChild(del);root.appendChild(dz);
}

/* ---- total ---- */
function scrTotal(){
  var inv=findInv(openId);
  if(!inv){view='list';return render();}
  var c=el('div','card');
  var sh=el('div','sum-head');
  sh.appendChild(el('h1','',inv.title));
  var d=new Date();
  sh.appendChild(el('span','','صدرت بتاريخ '+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()));
  c.appendChild(sh);
  if(!inv.items.length){c.appendChild(el('p','lead','الفاتورة فاضية.'));}
  else{
    var w=el('div','tbl-wrap');var t=document.createElement('table');
    var hd=document.createElement('tr');['البند','الكمية','السعر','المجموع','التاريخ والوقت'].forEach(function(x){hd.appendChild(el('th','',x));});
    t.appendChild(hd);
    inv.items.forEach(function(it){
      var tr=document.createElement('tr');
      tr.appendChild(el('td','',it.name));
      tr.appendChild(el('td','n',String(it.qty||1)));
      tr.appendChild(el('td','n',(Number(it.price)||0).toFixed(2)));
      tr.appendChild(el('td','n',(Math.round(lineTotal(it)*100)/100).toFixed(2)));
      var when=[dateAr(it.date),timeAr(it.time)].filter(Boolean).join(' ');
      tr.appendChild(el('td','',when||'—'));
      t.appendChild(tr);
    });
    w.appendChild(t);c.appendChild(w);
  }
  var tot=el('div','total');tot.appendChild(el('span','','الإجمالي ('+inv.items.length+' بنود)'));tot.appendChild(el('span','v',fmt(grand(inv.items))));
  c.appendChild(tot);
  root.appendChild(c);
  var r=el('div','row print-hide');
  r.appendChild(btn('حفظ PDF (A4)','btn grow',function(){window.print();}));
  r.appendChild(btn('رجوع للفاتورة','btn ghost grow',function(){view='invoice';render();}));
  r.appendChild(btn('نسخ الملخص','btn grow',function(){
    var lines=[inv.title,''];
    inv.items.forEach(function(it){lines.push(it.name+' — '+(it.qty||1)+' × '+(Number(it.price)||0).toFixed(2)+' = '+fmt(lineTotal(it)));});
    lines.push('','الإجمالي: '+fmt(grand(inv.items)));
    var txt=lines.join('\n');
    try{navigator.clipboard.writeText(txt).then(function(){setNotice('تم نسخ الملخص.',false);render();},function(){setNotice('ما قدرنا ننسخ. انسخه يدوياً.',true);render();});}
    catch(e){setNotice('ما قدرنا ننسخ.',true);render();}
  }));
  root.appendChild(r);
}

if(code){loadInvoices().then(function(ok){if(ok)view='list';render();});}
else render();
})();
</script>
</body>
</html>
